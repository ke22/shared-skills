<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IASDR Layout Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="iasdr.css">
<script src="icons.js"></script>
<style>.lib-label{font:600 26px/1.3 var(--f-body);color:#333;width:1920px}.lib-label b{color:var(--struct-mark)}</style>
</head>
<body class="show-slots">
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="ig" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="24"><stop offset="0" stop-color="#0C98FE"/><stop offset="1" stop-color="#2F82FC"/></linearGradient></defs></svg>
<div id="root"></div>
<script>
/* =====================================================================
   Layout library: one slide per narrative layout (variant a, plus N06c).
   Slot text describes what belongs in each slot; numbers are samples.
   IDs follow ../references/narrative-layouts.md; components follow components.md.
   ===================================================================== */
let L='en';
const T=(en,zh)=>L==='en'?en:zh;
const I=(n,s=64,c='')=>{const w=(s>=96?6:s>=56?4:s>=36?3:2.5)*24/s;return `<svg class="ic ${c}" width="${s}" height="${s}" viewBox="0 0 24 24" style="stroke-width:${w}">${ICONS[n]||''}</svg>`;};
const A=(w=64,dir='r')=>{const r={r:0,l:180,d:90,u:-90}[dir];return `<svg class="arr" width="${w}" height="${w}" viewBox="0 0 64 64" style="transform:rotate(${r}deg)"><path d="M8 32H54M40 18l14 14-14 14"/></svg>`;};
const TB=(ee,ez,te,tz)=>`<header class="tb"><p class="eyebrow">${T(ee,ez+`<span class="en">${ee}</span>`)}</p><h1 class="title">${T(te,tz)}</h1></header>`;
const NOTE=()=>`<p class="sample-note">${T('Sample content · slot guidance','示意內容・欄位說明')}</p>`;
const SRC=(e,z)=>`<p class="src">${T(e,z)}</p>`;
const ROLE=(k,icon,e,z)=>`<span class="role r${k}"><i>${I(icon,40,'white')}</i>${T(e,z)}</span>`;
const STAT=(v,u,e,z)=>`<div class="stat"><p class="v">${v}<small>${u}</small></p><p class="l">${T(e,z)}</p></div>`;
const VMARK={met:'<svg data-mark="met" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',partly:'<svg data-mark="partly" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 5a7 7 0 0 1 0 14z" fill="currentColor"/></svg>',gap:'<svg data-mark="gap" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>'};
const QUOTE=(e,z,be,bz)=>`<div class="quote"><div><p>${T(e,z)}</p><p class="by">${T(be,bz)}</p></div></div>`;
const PHONE=(e,z)=>`<div class="phone"><div class="scr">${T(e,z)}</div></div>`;
const DESK=(e,z,w=640)=>`<div class="desk" style="width:${w}px"><div class="bez" style="height:${Math.round(w*.59)}px"><div class="scr">${T(e,z)}</div></div><div class="stand"></div><div class="foot"></div></div>`;
const PHOTO=(h,e,z)=>`<div class="photo" style="height:${h}px">${T(e,z)}</div>`;

const S=[];
const add=(id,ne,nz,html,cls='')=>S.push({id,ne,nz,html,cls});

/* ---------------- 0. universal ---------------- */
add('N38a','Claim and evidence · stacked cards','主張與佐證・疊卡',()=>`
${TB('Claim and evidence','主張與佐證','State one judgment; every card below supports it','一句判斷，下方每張卡都在支持它')}
<div class="body stack">
 <div class="card hcard" data-sem="evidence">${I('book-open',128)}<p class="h3">${T('Supporting point one','支持點一')}</p><p class="cite">${T('(Author, 2024)','（作者，2024）')}</p><p class="bl measure">${T('One or two sentences of evidence. Name the source on the right; keep each card to one idea.','一到兩句證據，右上標出處。每張卡只講一個重點。')}</p></div>
 <div class="card hcard" data-sem="evidence">${I('chart-column',128)}<p class="h3">${T('Supporting point two','支持點二')}</p><p class="cite">${T('(Agency, 2025)','（機構，2025）')}</p><p class="bl measure">${T('A second, independent line of evidence. Two or three cards at most.','第二條獨立的證據。最多兩到三張卡。')}</p></div>
</div>${NOTE()}`);

add('N39a','Composition · equal columns','組成與並列・等寬欄',()=>`
${TB('Composition','組成與並列','A whole is made of three parts of equal weight','一個整體由三個同等份量的部分組成')}
<div class="body g3">
 ${[['layers','Part one','第一部分'],['workflow','Part two','第二部分'],['network','Part three','第三部分']].map(([ic,e,z])=>`<div class="card icard">${I(ic,128)}<p class="h3">${T(e,z)}</p><p class="b">${T('What this part contributes, in one or two lines.','這部分的作用，一到兩行。')}</p></div>`).join('')}
</div>${NOTE()}`);

add('N47a','Custom figure','自訂圖解',()=>`
${TB('Custom figure','自訂圖解','A one-off relationship gets its own figure, not a forced layout','一次性的關係，用自訂圖呈現，不硬套版型')}
<div class="body col gap24">
 <figure class="figure" data-figure-kind="nested-scope">
  <div class="canvas"><svg width="1100" height="440" viewBox="0 0 1100 440">
   <rect x="20" y="20" width="1060" height="400" rx="32" fill="var(--tint)"/><rect x="200" y="80" width="700" height="280" rx="24" fill="var(--card)" stroke="var(--struct-muted)" stroke-width="3"/>
   <rect x="380" y="150" width="340" height="140" rx="16" fill="var(--struct-mark)"/>
   <text x="60" y="64" style="font:600 22px var(--f-body);fill:var(--text-2)">${T('Organisation','組織')}</text>
   <text x="236" y="122" style="font:600 22px var(--f-body);fill:var(--text-2)">${T('Service system','服務系統')}</text>
   <text x="550" y="230" text-anchor="middle" style="font:700 30px var(--f-head);fill:#fff">${T('Ritual data','儀式資料')}</text>
  </svg></div>
  <figcaption>${T('Figure: three nested scopes that no standard layout expresses. Kind: nested-scope.','圖：三層巢狀範圍，現有版型無法表達。類型：nested-scope。')}</figcaption>
 </figure>
 <p class="band soft">${T('If this kind appears in three decks, promote it to a component.','同一類型在三份簡報出現，就升格成正式元件。')}</p>
</div>${NOTE()}`);

/* ---------------- A. opening ---------------- */
add('N01a','Cover with scale','封面與規模',()=>`
<div class="photo-slot" data-label="${T('PHOTO SLOT · duotone 15%','照片位置・雙色調 15%')}"></div>
<p class="logo-slot" style="position:relative">${T('Logo','標誌')}</p>
<span class="chip outline" style="position:relative;margin-top:56px;align-self:flex-start;box-shadow:inset 0 0 0 2px #fff;color:#fff">${T('Master’s thesis defence 2026','2026 碩士論文口試')}</span>
<h1 style="position:relative;margin-top:40px;font:var(--display-w) var(--display)/var(--display-lh) var(--f-head);letter-spacing:var(--display-tr);max-width:1450px">${T('One line that names the study','一句話點出<br>這份研究')}</h1>
<div class="row gap56" style="position:relative;margin-top:56px">${STAT('21','','interviews and reviews','場訪談與評測')}${STAT('19','','participants','位受訪者')}${STAT('3','','partner teams','個合作團隊')}</div>
<div class="row gap24" style="position:absolute;right:var(--mx);bottom:var(--mb)"><span class="avatar">${T('Photo','照片')}</span><span style="font:700 24px/1.35 var(--f-body)">${T('Presenter name<br>Affiliation','報告者姓名<br>單位')}</span></div>`,'field cover');

add('N02a','Agenda and section map','議程與段落導覽',()=>`
${TB('Contents','簡報目錄','Four sections, in the order the audience needs them','四個段落，依聽眾需要的順序')}
<div class="body g4">
 ${[['01','Overview','專案說明'],['02','Findings','前期研究'],['03','Design','設計成果'],['04','Demo','系統展示']].map(([n,e,z],i)=>`<div class="card seccard"><p class="big">${n}</p>${T('',`<p class="en">${e}</p>`)}<p class="h3">${T(e,z)}</p><ul><li>${T('Point one','要點一')}</li><li>${T('Point two','要點二')}</li><li>${T('Point three','要點三')}</li></ul></div>`).join('')}
</div><p class="secmark">00</p>${NOTE()}`);

add('N03a','Team and roles','團隊與分工',()=>`
${TB('Team','專案團隊','Three partners, each responsible for one part of the work','三個團隊，各自負責一部分工作')}
<div class="body g3">
 ${[['Design','設計','pencil'],['Care','照護','stethoscope'],['Technology','技術','bot']].map(([e,z])=>`<div class="card person"><span class="avatar">${T('Photo','照片')}</span><div class="col gap16"><span class="chip sm" style="align-self:flex-start">${T(e,z)}</span><p class="h3">${T('Team lead name','負責人姓名')}</p></div><p class="org">${T('University · Department','學校・系所')}</p><p class="b" style="grid-column:1/3">${T('What this team owns, in one sentence.','這個團隊負責什麼，一句話。')}</p><p class="cap members">${T('Members: name, name','成員：姓名、姓名')}</p></div>`).join('')}
</div>${NOTE()}`);

/* ---------------- B. context ---------------- */
add('N04a','Problem scale · stat clusters','問題規模・數字群',()=>`
${TB('Background','研究背景','Say how big the problem is, then show the numbers','先說問題多大，再用數字證明')}
<div class="body g3">
 ${[['Demand','需求面'],['Workforce','人力面'],['Daily load','日常負擔']].map(([e,z],i)=>`<div class="card" data-sem="evidence"><p class="h2">${T(e,z)}</p><div class="cluster">${STAT(['35','90','35'][i],T(['k','k','h'][i],['萬','萬','小時'][i]),'Label for this number','這個數字的說明')}${STAT(['1.6','70','4'][i],T(['k','%','×'][i],['萬','%','倍'][i]),'Label for this number','這個數字的說明')}</div></div>`).join('')}
</div>${SRC('Sources: agency (year); agency (year).','資料來源：機構（年份）；機構（年份）。')}${NOTE()}`);

add('N46a','Root cause · push and constraint','問題成因・推力與限制',()=>`
${TB('Background','研究背景','Two forces meet and make the problem hard','兩股力量交會，讓問題變得困難')}
<div class="body col gap40">
 <div class="row center gap32 fill">
  <div class="circ soft" style="--d:400px;flex-direction:column;gap:12px"><p class="h2">${T('External push','外部推力')}</p><p class="b muted">${T('What is changing outside','外部正在改變的事')}</p></div>
  ${A(80)}<div class="circ dark" style="--d:280px;font-size:var(--h3)">${T('The challenge','核心挑戰')}</div>${A(80,'l')}
  <div class="circ soft" style="--d:400px;flex-direction:column;gap:12px"><p class="h2">${T('Internal limit','內部限制')}</p><p class="b muted">${T('What the organisation cannot change quickly','組織短期改不了的事')}</p></div>
 </div>
 <p class="band soft tc">${T('One sentence on why a new approach is needed.','一句話說明為什麼需要新的做法。')}</p>
</div>${NOTE()}`);

add('N05a','Research gap and entry point','研究缺口與切入點',()=>`
${TB('Research gap','研究缺口','What is known, what is missing, and where this study enters','已知什麼、缺什麼，這份研究從哪切入')}
<div class="body col gap40 vc">
 <div style="display:grid;grid-template-columns:1fr 56px 1fr 56px 1fr;align-items:stretch">
  ${[['01','What is known','已知'],['02','What is promising','潛力'],['03','What is missing','缺口']].map(([n,e,z],i)=>`${i?`<div class="row center">${A(48)}</div>`:''}<div class="card" style="height:100%"><p class="num">${n}</p><p class="h3">${T(e,z)}</p><p class="b mt16">${T('Two lines that summarise the literature.','兩行文獻摘要。')}</p></div>`).join('')}
 </div>
 <p class="band">${T('Entry point: the one gap this study addresses.','切入點：這份研究要補的那個缺口。')}</p>
</div>${NOTE()}`);

add('N06a','Question (opening)','提問（開場）',()=>`
<div class="photo-slot" data-label="${T('PHOTO SLOT','照片位置')}"></div>
<p class="kicker" style="position:relative">${T('How might we','我們該如何')}</p>
<p class="big" style="position:relative">${T('One question the whole study answers?','用一個問題，<br>概括整份研究要回答的事？')}</p>`,'field statement');

add('N06c','Section transition','段落過場',()=>`
<div class="col center fill tc gap40">
 <p class="eyebrow" style="margin:0">${T('Section 4.2 · Organisation','4.2 組織內部層面')}</p>
 <p style="font:var(--h1-w) var(--h1)/var(--h1-lh) var(--f-head);color:var(--ink);max-width:1400px">${T('The claim this section will support, in two lines at most','這一段要支持的主張，<br>最多兩行')}</p>
 <span style="width:96px;height:8px;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--bar-top),var(--bar-bottom))"></span>
</div>${NOTE()}`);

add('N07b','Research question and objectives','研究問題與目標',()=>`
${TB('Research question','研究問題與目標','One question, then the objectives that answer it','一個研究問題，以及回答它的目標')}
<div class="body col gap56 vc">
 <div class="qbox"><p class="lead">${T('How can the approach improve the service in this setting?','如何運用這個方法，改善此場域的服務？')}</p></div>
 <div class="col gap32">${['O1','O2','O3'].map((o,i)=>`<div class="row gap32"><span class="idtag">${o}</span><p class="bl">${T(['Map the current service and its breaks.','Explain how the designer turns needs into rules.','Describe what AI changes in the design process.'][i],['梳理現行服務與斷點。','說明設計師如何把需求轉為制度。','說明 AI 在設計過程中改變了什麼。'][i])}</p></div>`).join('')}</div>
</div>${NOTE()}`);

add('N08a','Knowledge framework','知識框架',()=>`
${TB('Framework','知識框架','The study builds on a five-module framework','研究依據一個五模組的框架')}
<div class="body col gap16 vc">
 <div style="display:grid;grid-template-columns:1fr 2fr 2fr;gap:24px">${[['Understand','理解'],['Self-care','照顧者自身'],['Skills','照顧技巧']].map(([e,z])=>`<p class="chip outline" style="justify-content:center">${T(e,z)}</p>`).join('')}</div>
 <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:24px">
  ${[1,2,3,4,5].map(i=>`<div class="card md ${i===5?'focus':''}" style="display:flex;flex-direction:column;gap:16px"><span class="idtag ${i===5?'':'soft'}" style="align-self:flex-start">M${i}</span><p class="h3">${T('Module name','模組名稱')}</p><p class="b muted">${T('What it covers.','涵蓋的內容。')}</p></div>`).join('')}
 </div>
 <p class="cap">${T('M5 is the focus of this study.','M5 是本研究聚焦的模組。')}</p>
</div>${SRC('Source: framework author (year).','資料來源：框架作者（年份）。')}${NOTE()}`);

/* ---------------- C. method ---------------- */
add('N09a','Research process · diamonds','研究流程總覽・鑽石',()=>`
${TB('Method','研究方法','Three stages move from the problem to field validation','三個階段，從問題走到場域驗證')}
<div class="body col center">
 <svg class="dia" width="1640" height="560" viewBox="0 0 1640 560">
  ${[0,1,2].map(i=>{const cx=290+i*530;return `<polygon class="${i===1?'on':''}" points="${cx},30 ${cx+260},280 ${cx},530 ${cx-260},280"/><text x="${cx}" y="262" text-anchor="middle">${T(['Define','Develop','Validate'][i],['問題梳理','設計開發','場域驗證'][i])}</text><text class="sub" x="${cx}" y="312" text-anchor="middle">${T(['12 sessions · 10 people','6 sessions · 6 people','3 sessions · 3 people'][i],['12 場・10 人','6 場・6 人','3 場・3 人'][i])}</text>`}).join('')}
 </svg>
</div>${NOTE()}`);

add('N40a','Case and selection','研究個案與選擇理由',()=>`
${TB('Case','研究個案','Why this case was chosen','為什麼選擇這個個案')}
<div class="body s75">
 <div class="col gap32">
  <div class="row gap24"><span class="chip">${T('Owner','業主')}</span><p class="bl">${T('Organisation name','組織名稱')}</p></div>
  <div class="row gap24"><span class="chip">${T('Team','團隊')}</span><p class="bl">${T('Who carried out the work','實際執行的人')}</p></div>
  <hr class="rule">
  ${[1,2,3].map(i=>`<div class="row gap24" style="align-items:flex-start"><span class="pin">${i}</span><div><p class="h3">${T('Selection reason','選擇理由')} ${i}</p><p class="b mt16">${T('Evidence for this reason in one line.','這個理由的依據，一行。')}</p></div></div>`).join('')}
 </div>
 <div class="col gap24">${PHOTO(330,'Field photo · blur faces','現場照片・人臉需模糊')}${PHOTO(330,'Field photo · blur faces','現場照片・人臉需模糊')}</div>
</div>${NOTE()}`);

add('N10a','Method rationale','方法依據與資料蒐集',()=>`
${TB('Method','研究方法','Every step is backed by a method','每一步都有方法依據')}
<div class="body col gap40">
 <div class="rail">${['Recruit','Use','Identify','Recall','Close'].map((e,i)=>`<div class="st"><span class="o">${i+1}</span><p class="h3" style="font-size:var(--body-l)">${T(e,['招募','使用','辨識','回溯','收尾'][i])}</p></div>`).join('')}</div>
 <table class="tbl"><tr><th>${T('Procedure','程序')}</th><th>${T('Data','主要資料')}</th><th>${T('Method basis','方法依據')}</th></tr>
 ${[1,2,3].map(i=>`<tr><td class="k">${T('Procedure','程序')} ${i}</td><td>${T('What is recorded','記錄什麼資料')}</td><td>${T('Which method justifies it','依據哪個方法')}</td></tr>`).join('')}</table>
 <p class="band soft">${T('Stop or extend rule: when the design adds participants.','停止或補充規則：什麼情況下增加受訪者。')}</p>
</div>${NOTE()}`);

add('N11a','Stage navigator and detail','階段導覽＋細節',()=>`
${TB('Process','流程','Each stage page shows where the audience is','每個階段頁都標出聽眾現在在哪裡')}
<div class="body nav-split">
 <div class="funnel">${[1,2,3,4].map(i=>`<div class="stage ${i===3?'on':''}"><p class="n">${T('Phase','階段')} ${i}</p><p class="t">${T('Stage name','階段名稱')}</p></div>`).join('')}</div>
 <div class="card detail"><p class="h2">${T('Stage name','階段名稱')}</p>${[['Input','輸入'],['Rule','原則'],['Output','產出']].map(([e,z])=>`<div class="kv"><span class="chip">${T(e,z)}</span><span class="v">${T('One line','一行說明')}</span></div>`).join('')}</div>
</div>${NOTE()}`);

add('N12a','Study design · delayed intervention','研究設計・延遲介入',()=>`
${TB('Study design','研究設計','Groups receive the intervention at different times','不同組別在不同時間接受介入')}
<div class="body col gap40">
 <div class="gtl" style="--cols:5"><span></span>${[['Intake','收案'],['Month 1','第 1 個月'],['','　'],['Month 2','第 2 個月'],['','　']].map(([e,z])=>`<p class="hd">${T(e,z)}</p>`).join('')}
  <p class="g">${T('Intervention','介入組')}<small>${T('Odd-numbered sites','奇數序號機構')}</small></p><div class="cell t">${T('Pre-test','前測')}</div><div class="cell i">${T('Use the tool','使用工具')}</div><div class="cell t">${T('Post-test','後測')}</div><div class="cell x" style="grid-column:span 2">${T('Focus group','焦點團體')}</div>
  <p class="g">${T('Delayed','延遲介入組')}<small>${T('Even-numbered sites','偶數序號機構')}</small></p><div class="cell t">${T('Pre-test','前測')}</div><div class="cell w">${T('Usual care','維持原有資源')}</div><div class="cell t">${T('Post-test 1','後測一')}</div><div class="cell i">${T('Use the tool','使用工具')}</div><div class="cell t">${T('Post-test 2','後測二')}</div>
 </div>
 <div class="g3">${[['Method','研究方法'],['Assignment','分派原則'],['Power','權力關係']].map(([e,z])=>`<div class="card md"><p class="h2">${T(e,z)}</p><p class="b mt16">${T('One rule that protects the comparison.','一條保護比較公平性的規則。')}</p></div>`).join('')}</div>
</div>${NOTE()}`);

add('N13a','Hypotheses and criteria','假設與判斷標準',()=>`
${TB('Hypotheses','研究假設','Each hypothesis has a criterion and a data source','每個假設都有判斷標準與資料來源')}
<div class="body col center">
