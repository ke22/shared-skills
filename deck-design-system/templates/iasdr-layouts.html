<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IASDR Layout Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="iasdr.css">
<script src="icons.js"></script>
<style>.lib-label{font:600 26px/1.3 var(--f-body);color:#333;width:1920px}.lib-label b{color:var(--struct-mark)}</style>
</head>
<body class="show-slots">
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="ig" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="24"><stop offset="0" stop-color="#0C98FE"/><stop offset="1" stop-color="#2F82FC"/></linearGradient></defs></svg>
<div id="root"></div>
<script>
/* =====================================================================
   Layout library: one slide per narrative layout (variant a, plus N06c).
   Slot text describes what belongs in each slot; numbers are samples.
   IDs follow ../references/narrative-layouts.md; components follow components.md.
   ===================================================================== */
let L='en';
const T=(en,zh)=>L==='en'?en:zh;
const I=(n,s=64,c='')=>{const w=(s>=96?6:s>=56?4:s>=36?3:2.5)*24/s;return `<svg class="ic ${c}" width="${s}" height="${s}" viewBox="0 0 24 24" style="stroke-width:${w}">${ICONS[n]||''}</svg>`;};
const A=(w=64,dir='r')=>{const r={r:0,l:180,d:90,u:-90}[dir];return `<svg class="arr" width="${w}" height="${w}" viewBox="0 0 64 64" style="transform:rotate(${r}deg)"><path d="M8 32H54M40 18l14 14-14 14"/></svg>`;};
const TB=(ee,ez,te,tz,c)=>`<header class="tb"><p class="eyebrow">${T(ee,ez+`<span class="en">${ee}</span>`)}</p>${c?CLAIM(c):''}<h1 class="title">${T(te,tz)}</h1></header>`;
const NOTE=()=>`<p class="sample-note">${T('Sample content · slot guidance','示意內容・欄位說明')}</p>`;
const SRC=(e,z)=>`<p class="src">${T(e,z)}</p>`;
const ROLE=(k,icon,e,z)=>`<span class="role r${k}"><i>${I(icon,40,'white')}</i>${T(e,z)}</span>`;
const STAT=(v,u,e,z)=>`<div class="stat"><p class="v">${v}<small>${u}</small></p><p class="l">${T(e,z)}</p></div>`;
const VMARK={met:'<svg data-mark="met" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',partly:'<svg data-mark="partly" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 5a7 7 0 0 1 0 14z" fill="currentColor"/></svg>',gap:'<svg data-mark="gap" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>'};
const CMARK={confirmed:'<svg data-mark="confirmed" viewBox="0 0 24 24"><circle class="fill" cx="12" cy="12" r="9"/></svg>',prelim:'<svg data-mark="prelim" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path class="fill" d="M12 4a8 8 0 0 1 0 16z"/></svg>',unverified:'<svg data-mark="unverified" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>'};
const CLAIM=k=>`<span class="claim ${k}">${CMARK[k]}${T({confirmed:'Confirmed',prelim:'Preliminary',unverified:'Not yet verified'}[k],{confirmed:'已確認',prelim:'初步觀察',unverified:'尚未驗證'}[k])}</span>`;
const QUOTE=(e,z,be,bz)=>`<div class="quote"><div><p>${T(e,z)}</p><p class="by">${T(be,bz)}</p></div></div>`;
const PHONE=(e,z)=>`<div class="phone"><div class="scr">${T(e,z)}</div></div>`;
const DESK=(e,z,w=640)=>`<div class="desk" style="width:${w}px"><div class="bez" style="height:${Math.round(w*.59)}px"><div class="scr">${T(e,z)}</div></div><div class="stand"></div><div class="foot"></div></div>`;
const PHOTO=(h,e,z)=>`<div class="photo" style="height:${h}px">${T(e,z)}</div>`;

const S=[];
const add=(id,ne,nz,html,cls='')=>S.push({id,ne,nz,html,cls});

/* ---------------- 0. universal ---------------- */
add('N38a','Claim and evidence · stacked cards','主張與佐證・疊卡',()=>`
${TB('Claim and evidence','主張與佐證','State one judgment; every card below supports it','一句判斷，下方每張卡都在支持它')}
<div class="body stack">
 <div class="card hcard" data-sem="evidence">${I('book-open',128)}<p class="h3">${T('Supporting point one','支持點一')}</p><p class="cite">${T('(Author, 2024)','（作者，2024）')}</p><p class="bl measure">${T('One or two sentences of evidence. Name the source on the right; keep each card to one idea.','一到兩句證據，右上標出處。每張卡只講一個重點。')}</p></div>
 <div class="card hcard" data-sem="evidence">${I('chart-column',128)}<p class="h3">${T('Supporting point two','支持點二')}</p><p class="cite">${T('(Agency, 2025)','（機構，2025）')}</p><p class="bl measure">${T('A second, independent line of evidence. Two or three cards at most.','第二條獨立的證據。最多兩到三張卡。')}</p></div>
</div>${NOTE()}`);

add('N38b','Claim and evidence · lead and two columns','主張與佐證・引言＋兩欄',()=>`
${TB('Claim and evidence','主張與佐證','One summary sentence, then the two sides that support it','先一句總結，再用兩個面向支持它')}
<div class="body"><div class="card split">
 <p class="lead" data-sem="claim">${T('The judgement in one sentence the audience can repeat.','聽眾能複述的一句判斷。')}</p>
 <hr class="rule">
 <div class="cols" data-sem="evidence">${[['book-open','First aspect','第一個面向'],['users','Second aspect','第二個面向']].map(([ic,e,z])=>`<div class="col">${I(ic,96)}<div><p class="h3">${T(e,z)}</p><p class="b">${T('Two lines of evidence for this side, with the source.','這個面向的兩行證據，附出處。')}</p></div></div>`).join('')}</div>
</div></div>${NOTE()}`);

add('N38c','Claim and evidence · problem and response','主張與佐證・問題 → 回應',()=>`
${TB('Claim and evidence','主張與佐證','A limit in practice calls for two responses','實務上的限制，需要兩種回應方式')}
<div class="body" style="display:grid;grid-template-columns:1fr 96px 1fr;align-items:center">
 <div class="card col"><span class="chip dark" style="align-self:flex-start">${T('Limit','限制')}</span><p class="h3 mt24">${T('What cannot be done today','目前做不到的事')}</p><p class="b mt16">${T('Why it matters for the people involved.','這件事為什麼會影響相關的人。')}</p></div>
 <div class="row center">${A(72)}</div>
 <div class="col gap32">${[['Response one','回應一'],['Response two','回應二']].map(([e,z])=>`<div class="card md"><p class="h3">${T(e,z)}</p><p class="b muted mt16">${T('How it eases the limit.','它如何緩解這個限制。')}</p></div>`).join('')}</div>
</div>${NOTE()}`);

add('N39a','Composition · equal columns','組成與並列・等寬欄',()=>`
${TB('Composition','組成與並列','A whole is made of three parts of equal weight','一個整體由三個同等份量的部分組成')}
<div class="body g3">
 ${[['layers','Part one','第一部分'],['workflow','Part two','第二部分'],['network','Part three','第三部分']].map(([ic,e,z])=>`<div class="card icard">${I(ic,128)}<p class="h3">${T(e,z)}</p><p class="b">${T('What this part contributes, in one or two lines.','這部分的作用，一到兩行。')}</p></div>`).join('')}
</div>${NOTE()}`);

add('N39b','Composition · principle grid','組成與並列・原則格',()=>`
${TB('Principles','設計原則','Six short principles guide every design decision','六條簡短原則，引導每個設計決定')}
<div class="body g3" style="grid-auto-rows:1fr">
 ${[1,2,3,4,5,6].map(i=>`<div class="card md"><p class="num">0${i}</p><p class="h3">${T('Principle in a few words','幾個字的原則')}</p><p class="b muted mt16">${T('One line on what it rules out.','一行說明它排除什麼。')}</p></div>`).join('')}
</div>${NOTE()}`);

add('N39c','Composition · radial facets','組成與並列・放射構面',()=>`
${TB('Composition','組成與並列','One core idea seen through four facets','一個核心概念，從四個面向理解')}
<div class="body col center">
 <div style="position:relative;width:1200px;height:660px">
  <svg width="1200" height="660" style="position:absolute;left:0;top:0">${[[600,110],[1010,330],[600,550],[190,330]].map(([x,y])=>`<line x1="600" y1="330" x2="${x}" y2="${y}" style="stroke:var(--struct-line);stroke-width:3"/>`).join('')}</svg>
  <div class="net-node" style="left:600px;top:330px"><div class="circ solid" style="--d:260px;font-size:var(--h3)">${T('Core idea','核心概念')}</div></div>
  ${[[600,110,'Facet one','面向一'],[1010,330,'Facet two','面向二'],[600,550,'Facet three','面向三'],[190,330,'Facet four','面向四']].map(([x,y,e,z])=>`<div class="net-node" style="left:${x}px;top:${y}px"><div class="circ" style="--d:200px">${T(e,z)}</div></div>`).join('')}
 </div>
</div>${NOTE()}`);

add('N47a','Custom figure','自訂圖解',()=>`
${TB('Custom figure','自訂圖解','A one-off relationship gets its own figure, not a forced layout','一次性的關係，用自訂圖呈現，不硬套版型')}
<div class="body col gap24">
 <figure class="figure" data-figure-kind="nested-scope">
  <div class="canvas"><svg width="1100" height="440" viewBox="0 0 1100 440">
   <rect x="20" y="20" width="1060" height="400" rx="32" fill="var(--tint)"/><rect x="200" y="80" width="700" height="280" rx="24" fill="var(--card)" stroke="var(--struct-muted)" stroke-width="3"/>
   <rect x="380" y="150" width="340" height="140" rx="16" fill="var(--struct-mark)"/>
   <text x="60" y="64" style="font:600 22px var(--f-body);fill:var(--text-2)">${T('Organisation','組織')}</text>
   <text x="236" y="122" style="font:600 22px var(--f-body);fill:var(--text-2)">${T('Service system','服務系統')}</text>
   <text x="550" y="230" text-anchor="middle" style="font:700 30px var(--f-head);fill:#fff">${T('Ritual data','儀式資料')}</text>
  </svg></div>
  <figcaption>${T('Figure: three nested scopes that no standard layout expresses. Kind: nested-scope.','圖：三層巢狀範圍，現有版型無法表達。類型：nested-scope。')}</figcaption>
 </figure>
 <p class="band soft">${T('If this kind appears in three decks, promote it to a component.','同一類型在三份簡報出現，就升格成正式元件。')}</p>
</div>${NOTE()}`);

/* ---------------- A. opening ---------------- */
add('N01a','Cover with scale','封面與規模',()=>`
<div class="photo-slot" data-label="${T('PHOTO SLOT · duotone 15%','照片位置・雙色調 15%')}"></div>
<p class="logo-slot" style="position:relative">${T('Logo','標誌')}</p>
<span class="chip outline" style="position:relative;margin-top:56px;align-self:flex-start;box-shadow:inset 0 0 0 2px #fff;color:#fff">${T('Master’s thesis defence 2026','2026 碩士論文口試')}</span>
<h1 style="position:relative;margin-top:40px;font:var(--display-w) var(--display)/var(--display-lh) var(--f-head);letter-spacing:var(--display-tr);max-width:1450px">${T('One line that names the study','一句話點出<br>這份研究')}</h1>
<div class="row gap56" style="position:relative;margin-top:56px">${STAT('21','','interviews and reviews','場訪談與評測')}${STAT('19','','participants','位受訪者')}${STAT('3','','partner teams','個合作團隊')}</div>
<div class="row gap24" style="position:absolute;right:var(--mx);bottom:var(--mb)"><span class="avatar">${T('Photo','照片')}</span><span style="font:700 24px/1.35 var(--f-body)">${T('Presenter name<br>Affiliation','報告者姓名<br>單位')}</span></div>`,'field cover');

add('N01b','Cover · project with scale and product','封面與規模・專案',()=>`
<div class="photo-slot" data-label="${T('PHOTO SLOT · duotone 15%','照片位置・雙色調 15%')}"></div>
<p class="logo-slot" style="position:relative">${T('Logo','標誌')}</p>
<span class="chip outline" style="position:relative;margin-top:56px;align-self:flex-start;box-shadow:inset 0 0 0 2px #fff;color:#fff">${T('Project plan 2026','2026 專案計畫')}</span>
<h1 style="position:relative;margin-top:40px;font:var(--display-w) var(--display)/var(--display-lh) var(--f-head);letter-spacing:var(--display-tr);max-width:880px">${T('One line that names the project','一句話點出<br>這個專案')}</h1>
<div class="row gap56" style="position:relative;margin-top:56px">${STAT('3','','partner teams','個合作團隊')}${STAT('120','+','care workers','位居服員')}${STAT('12','','months','個月')}</div>
<div style="position:absolute;right:600px;top:200px">${PHONE('Product screen','產品畫面')}</div>`,'field cover');

add('N01c','Cover · thesis defence','封面與規模・口試',()=>`
<div class="photo-slot" data-label="${T('PHOTO SLOT · duotone 15%','照片位置・雙色調 15%')}"></div>
<p class="logo-slot" style="position:relative">${T('Logo','標誌')}</p>
<span class="chip outline" style="position:relative;margin-top:56px;align-self:flex-start;box-shadow:inset 0 0 0 2px #fff;color:#fff">${T('Master’s thesis defence','碩士學位論文口試')}</span>
<h1 style="position:relative;margin-top:40px;font:var(--display-w) var(--display)/var(--display-lh) var(--f-head);letter-spacing:var(--display-tr);max-width:1300px">${T('Thesis title in the language of the defence','論文題目以口試語言<br>寫在這裡')}</h1>
<p style="position:relative;margin-top:32px;font:var(--subtitle-w) var(--subtitle)/var(--subtitle-lh) var(--f-head);max-width:1400px" lang="${T('zh-Hant','en')}">${T('論文題目的另一種語言版本','Thesis title in the other language')}</p>
<div class="row gap56" style="position:absolute;left:var(--mx);bottom:var(--mb)">${[['Student','研究生'],['Advisor','指導教授']].map(([e,z])=>`<div class="row gap24"><span class="avatar">${T('Photo','照片')}</span><span style="font:700 24px/1.35 var(--f-body)">${T(e,z)}<br>${T('Name','姓名')}</span></div>`).join('')}</div>`,'field cover');

add('N02a','Agenda and section map','議程與段落導覽',()=>`
${TB('Contents','簡報目錄','Four sections, in the order the audience needs them','四個段落，依聽眾需要的順序')}
<div class="body g4">
 ${[['01','Overview','專案說明'],['02','Findings','前期研究'],['03','Design','設計成果'],['04','Demo','系統展示']].map(([n,e,z],i)=>`<div class="card seccard"><p class="big">${n}</p>${T('',`<p class="en">${e}</p>`)}<p class="h3">${T(e,z)}</p><ul><li>${T('Point one','要點一')}</li><li>${T('Point two','要點二')}</li><li>${T('Point three','要點三')}</li></ul></div>`).join('')}
</div><p class="secmark">00</p>${NOTE()}`);

add('N02b','Agenda · section mark and running head','議程與段落導覽・段落浮水印＋頁首',()=>`
<div class="runhead"><span>${T('Project name · Unit','專案名稱・單位')}</span><span>2026</span></div>
${TB('Findings','前期研究','Every content page carries its section number','每個內容頁都標出所在段落')}
<div class="body g2">
 ${[['Running head','頁首'],['Section mark','段落浮水印']].map(([e,z],i)=>`<div class="card md"><p class="h3">${T(e,z)}</p><p class="b muted mt16">${T(i?'The large number at the top right says which section this page belongs to.':'Project, unit and year at the top edge, on every page of a long deck.',i?'右上的大號數字標出這一頁屬於哪一段。':'長簡報的每一頁上緣都放專案、單位與年份。')}</p></div>`).join('')}
</div><p class="secmark">02</p><p class="pnum">14</p>${NOTE()}`);

add('N02c','Agenda · chapter number','議程與段落導覽・章節編號小標',()=>`
${TB('Literature review 2.1','文獻探討 2.1','Thesis chapters keep their numbers on every slide','論文的章節編號，每一頁都保留')}
<div class="body g3">
 ${[['2.1','Service design','服務設計'],['2.2','Care work','照護工作'],['2.3','Generative AI','生成式 AI']].map(([n,e,z],i)=>`<div class="card md col ${i?'':'focus'}"><span class="idtag ${i?'soft':''}" style="align-self:flex-start">${n}</span><p class="h3 mt24">${T(e,z)}</p><p class="b muted mt16">${T('What this section of the chapter covers.','這一節涵蓋的內容。')}</p></div>`).join('')}
</div>${NOTE()}`);

add('N03a','Team and roles','團隊與分工',()=>`
${TB('Team','專案團隊','Three partners, each responsible for one part of the work','三個團隊，各自負責一部分工作')}
<div class="body g3">
 ${[['Design','設計','pencil'],['Care','照護','stethoscope'],['Technology','技術','bot']].map(([e,z])=>`<div class="card person"><span class="avatar">${T('Photo','照片')}</span><div class="col gap16"><span class="chip sm" style="align-self:flex-start">${T(e,z)}</span><p class="h3">${T('Team lead name','負責人姓名')}</p></div><p class="org">${T('University · Department','學校・系所')}</p><p class="b" style="grid-column:1/3">${T('What this team owns, in one sentence.','這個團隊負責什麼，一句話。')}</p><p class="cap members">${T('Members: name, name','成員：姓名、姓名')}</p></div>`).join('')}
</div>${NOTE()}`);

/* ---------------- B. context ---------------- */
add('N04a','Problem scale · stat clusters','問題規模・數字群',()=>`
${TB('Background','研究背景','Say how big the problem is, then show the numbers','先說問題多大，再用數字證明')}
<div class="body g3">
 ${[['Demand','需求面'],['Workforce','人力面'],['Daily load','日常負擔']].map(([e,z],i)=>`<div class="card" data-sem="evidence"><p class="h2">${T(e,z)}</p><div class="cluster">${STAT(['35','90','35'][i],T(['k','k','h'][i],['萬','萬','小時'][i]),'Label for this number','這個數字的說明')}${STAT(['1.6','70','4'][i],T(['k','%','×'][i],['萬','%','倍'][i]),'Label for this number','這個數字的說明')}</div></div>`).join('')}
</div>${SRC('Sources: agency (year); agency (year).','資料來源：機構（年份）；機構（年份）。')}${NOTE()}`);

add('N04b','Problem scale · chart and reading','問題規模・圖表＋解讀',()=>`
${TB('Background','研究背景','Online registration has doubled in five years','五年來，線上報名的比例成長一倍')}
<div class="body s75">
 <figure class="card chart" style="margin:0;align-self:center"><svg width="840" height="344" viewBox="0 0 840 344" role="img" aria-label="${T('Online share of registrations, 2020 to 2024','線上報名比例，2020 至 2024 年')}">
  <line class="ax" x1="0" y1="300" x2="840" y2="300"/>
  ${[18,22,27,31,36].map((v,i)=>{const h=Math.round(v*7.2),x=32+i*168,on=i===4?' on':'';return `<rect class="mk${on}" x="${x}" y="${300-h}" width="104" height="${h}" rx="8"/><text class="v${on}" x="${x+52}" y="${300-h-14}" text-anchor="middle">${v}%</text><text x="${x+52}" y="340" text-anchor="middle">${2020+i}</text>`;}).join('')}
 </svg><p class="take">${T('Since 2024, over a third of registrations are made online.','2024 年起，超過三分之一的報名在線上完成。')}</p></figure>
 <div class="col gap40" style="justify-content:center">${STAT('36','%','online share in 2024','2024 年線上比例')}${STAT('2','×','growth since 2020','相較 2020 年')}<p class="bl">${T('Say what the audience should see in the chart; one highlighted bar carries it.','說明聽眾該從圖上看到什麼；只凸顯一根長條。')}</p></div>
</div>${SRC('Source: agency registration records, 2020–2024 (sample data).','資料來源：機構報名紀錄，2020–2024（示意資料）。')}${NOTE()}`);

add('N04c','Problem scale · cited statements','問題規模・引用陳述卡',()=>`
${TB('Background','研究背景','The literature agrees the problem is growing','文獻一致指出問題正在擴大')}
<div class="body g3">
 ${[['(Author, 2021)','（作者，2021）'],['(Agency, 2023)','（機構，2023）'],['(Author & Author, 2024)','（作者、作者，2024）']].map(([e,z])=>`<div class="card md col gap24" data-sem="evidence"><p class="bl">${T('One statement from the literature, in the audience’s words.','一句來自文獻的陳述，用聽眾聽得懂的話。')}</p><p class="cite">${T(e,z)}</p></div>`).join('')}
</div>${SRC('Cross, N. (1999). Natural intelligence in design. <i>Design Studies, 20</i>(1), 25–39.','<span lang="en">Cross, N. (1999). Natural intelligence in design. <i>Design Studies, 20</i>(1), 25–39.</span>')}${NOTE()}`);

add('N46a','Root cause · push and constraint','問題成因・推力與限制',()=>`
${TB('Background','研究背景','Two forces meet and make the problem hard','兩股力量交會，讓問題變得困難')}
<div class="body col gap40">
 <div class="row center gap32 fill">
